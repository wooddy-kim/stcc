name: Crawl API (용인·화성·군포)

# 망포(Playwright)는 Vercel /api/cron/crawl-mangpo에 남고, 여기서는 API 크롤러만 돈다.
# 실행은 cron-job.org가 GitHub API(workflow_dispatch)로 건다. Actions schedule은
# 몰리면 건너뛰어서 쓰지 않는다. 다시 넣으면 외부 호출과 겹쳐 용인 요청이 늘어난다.
# 예약: 매시 7·22·37·52분 + 매일 KST 09:02(09:00 취소분 풀린 직후).
# 1회 약 700요청(군포 24 포함)이라 용인 부하를 생각해 더 줄이지 않는다.
# cron-job.org의 예전 Vercel /api/cron/crawl-api 잡은 Vercel 무료 사용량을 넘겨서 꺼 둔다.
on:
  workflow_dispatch:

# 용인 차단은 초당 요청 수 기준이라 두 회차가 겹치면 안 된다
concurrency:
  group: crawl-api
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run crawlers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run crawl -- HWASEONG_API YONGIN_API FMCS_RENT_API
