name: Crawl API (용인·화성)

# 망포(Playwright)는 Vercel /api/cron/crawl-mangpo에 남고, 여기서는 API 크롤러만 돈다.
# cron-job.org의 crawl-api 잡을 다시 켜면 용인 요청이 두 배가 되어 IP 차단 위험이 있다.
on:
  schedule:
    # 매시 7분 (정각은 Actions 예약이 몰려 지연이 잦다). 비공개 저장소 무료 한도(월 2,000분) 기준 매시가 상한
    - cron: '7 * * * *'
  workflow_dispatch:

# 용인 차단은 초당 요청 수 기준이라 두 회차가 겹치면 안 된다
concurrency:
  group: crawl-api
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run crawlers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run crawl -- HWASEONG_API YONGIN_API
